name: Policy-as-Code Admission & Network Governance CI (Kyverno)

on:
  push:
    branches:
      - main
      - master
    paths:
      - "policy-as-code/**"
      - "ai-mcp-governance/k8s-manifest.yaml"
      - "ai-mcp-governance/grafana-mcp-governance-dashboard.json"
      - ".github/workflows/policy-as-code-ci.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "policy-as-code/**"
      - "ai-mcp-governance/k8s-manifest.yaml"
      - "ai-mcp-governance/grafana-mcp-governance-dashboard.json"
      - ".github/workflows/policy-as-code-ci.yml"

jobs:
  kyverno-shift-left-validation:
    name: Shift-Left Kyverno CEL Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kyverno CLI (v1.20.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KYVERNO_VER="v1.20.0"
          gh release download "${KYVERNO_VER}" --repo kyverno/kyverno --pattern "kyverno-cli_${KYVERNO_VER}_linux_x86_64.tar.gz" --output /tmp/kyverno.tar.gz
          tar -xzf /tmp/kyverno.tar.gz -C /tmp kyverno
          sudo mv /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Run Kyverno Shift-Left Policy Test Suite (8 Positive & Negative Assertions)
        run: |
          kyverno test policy-as-code/ --detailed-results

  network-policy-and-siem-validation:
    name: Validate Zero-Trust NetworkPolicies & SIEM Telemetry Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate NetworkPolicy & Kyverno SIEM Shipper Governance Invariants
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import json, yaml; docs = list(yaml.safe_load_all(open('policy-as-code/network-policies.yaml'))) + list(yaml.safe_load_all(open('policy-as-code/kyverno-loki-shipper.yaml'))); assert len(docs) >= 8; assert all(d.get('metadata', {}).get('labels', {}).get('owner') == 'platform-security' for d in docs); assert all(d.get('metadata', {}).get('labels', {}).get('data-classification') == 'internal-telemetry' for d in docs); dash = json.load(open('ai-mcp-governance/grafana-mcp-governance-dashboard.json')); db = dash.get('dashboard', dash); assert {8, 9}.issubset({p.get('id') for p in db.get('panels', ())}); print('All Phase 21 Governance & SIEM CI Assertions Passed')"
