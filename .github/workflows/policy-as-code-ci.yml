name: Policy-as-Code Admission Gate (Kyverno)

on:
  push:
    branches: [ main, master ]
    paths:
      - "policy-as-code/**"
      - "ai-mcp-governance/k8s-manifest.yaml"
      - ".github/workflows/policy-as-code-ci.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "policy-as-code/**"
      - "ai-mcp-governance/k8s-manifest.yaml"
      - ".github/workflows/policy-as-code-ci.yml"

jobs:
  kyverno-shift-left-validation:
    name: Shift-Left Kyverno CEL Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kyverno CLI (v1.20.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KYVERNO_VER="v1.20.0"
          gh release download "${KYVERNO_VER}" --repo kyverno/kyverno --pattern "kyverno-cli_${KYVERNO_VER}_linux_x86_64.tar.gz" --output /tmp/kyverno.tar.gz
          tar -xzf /tmp/kyverno.tar.gz -C /tmp kyverno
          sudo mv /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Validate Compliant Workload Manifest (ai-mcp-governance/k8s-manifest.yaml)
        run: |
          pip install -q pyyaml
          python3 -c 'import yaml; docs=list(yaml.safe_load_all(open("ai-mcp-governance/k8s-manifest.yaml"))); dep=next(d for d in docs if d and d.get("kind")=="Deployment"); tpl=dep.get("spec").get("template"); ns={"apiVersion":"v1","kind":"Namespace","metadata":{"name":"lab-apps","labels":{"kubernetes.io/metadata.name":"lab-apps"}}}; pod={"apiVersion":"v1","kind":"Pod","metadata":{**tpl.get("metadata"),"name":"governed-pg-mcp","namespace":"lab-apps"},"spec":tpl.get("spec")}; open("/tmp/compliant-pod.yaml","w").write(yaml.safe_dump_all((ns,pod)))'
          kyverno apply policy-as-code/validating-policies.yaml --resource /tmp/compliant-pod.yaml

      - name: Verify Negative Policy Enforcement Against Non-Compliant Fixture
        run: |
          cat << 'EOF' > /tmp/non-compliant-pod.yaml
          apiVersion: v1
          kind: Namespace
          metadata:
            name: lab-apps
            labels:
              kubernetes.io/metadata.name: lab-apps
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: rogue-ci-pod
            namespace: lab-apps
          spec:
            containers:
              - name: rogue
                image: nginx:latest
                securityContext:
                  privileged: true
          EOF
          if kyverno apply policy-as-code/validating-policies.yaml --resource /tmp/non-compliant-pod.yaml; then
            echo "ERROR: Non-compliant pod unexpectedly passed Kyverno CEL policies!"
            exit 1
          else
            echo "SUCCESS: Kyverno CEL policies correctly rejected non-compliant workload."
          fi
