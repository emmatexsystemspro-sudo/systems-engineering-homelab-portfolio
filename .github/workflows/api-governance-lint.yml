name: API Governance & OpenAPI Linting

on:
  push:
    branches: [ main, master ]
    paths:
      - 'api-governance/**'
      - '.github/workflows/api-governance-lint.yml'
  pull_request:
    paths:
      - 'api-governance/**'

jobs:
  spectral-governance-check:
    name: Enforce OpenAPI 3.0 & Spectral Policy Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Stoplight Spectral Governance Linter
        run: npx -y @stoplight/spectral-cli lint api-governance/openapi.yaml --ruleset api-governance/.spectral.yaml --fail-severity error
