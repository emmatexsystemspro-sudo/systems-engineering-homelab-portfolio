name: API Governance & Contract Lifecycle Gate

on:
  push:
    branches: [ main, master ]
    paths:
      - 'api-governance/**'
      - '.github/workflows/api-governance-lint.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'api-governance/**'

jobs:
  spectral-governance-check:
    name: 1. OpenAPI Policy & Security Linting (Spectral)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Stoplight Spectral Governance Linter
        run: npx -y @stoplight/spectral-cli lint api-governance/openapi.yaml --ruleset api-governance/.spectral.yaml --fail-severity error

  breaking-change-check:
    name: 2. Breaking-Change Detection (oasdiff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base & Head Commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Base OpenAPI Spec from main
        run: git show origin/${{ github.base_ref }}:api-governance/openapi.yaml > /tmp/base-openapi.yaml

      - name: Run oasdiff Breaking-Change Gate
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: /tmp/base-openapi.yaml
          revision: api-governance/openapi.yaml
          fail-on-diff: true
