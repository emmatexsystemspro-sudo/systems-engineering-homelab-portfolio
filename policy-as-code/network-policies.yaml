apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lab-apps
  labels:
    owner: platform-security
    data-classification: internal-telemetry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: lab-apps
  labels:
    owner: platform-security
    data-classification: internal-telemetry
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.43.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: governed-pg-mcp-netpol
  namespace: lab-apps
  labels:
    owner: platform-security
    data-classification: internal-telemetry
spec:
  podSelector:
    matchLabels:
      app: governed-pg-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.31/32
      ports:
        - protocol: TCP
          port: 6433
    - to:
        - ipBlock:
            cidr: 192.168.1.35/32
      ports:
        - protocol: TCP
          port: 5543
    - to:
        - ipBlock:
            cidr: 192.168.1.36/32
      ports:
        - protocol: TCP
          port: 3100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ha-telemetry-dashboard-netpol
  namespace: lab-apps
  labels:
    owner: platform-security
    data-classification: internal-telemetry
spec:
  podSelector:
    matchLabels:
      app: ha-telemetry-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.31/32
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6433
